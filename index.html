  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker v4: Unregister any old/broken SWs first, then register fresh
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // Unregister all old service workers that may have cached bad MIME responses
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const reg of registrations) {
              const swUrl = reg.active && reg.active.scriptURL;
              // Force unregister if old cache version detected
              if (swUrl && !swUrl.includes('sw.js')) {
                await reg.unregister();
              }
            }
            // Register the fresh SW v4
            await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
          } catch (err) {
            console.warn('SW registration:', err);
          }
        });

        // Listen for SW_UPDATED message from ServiceWorker to automatically refresh page
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_UPDATED') {
            console.log('ServiceWorker updated, auto-refreshing...');
            window.location.reload();
          }
        });
      }
    </script>
  </body>
